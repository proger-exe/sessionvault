[project]
name = "sessionvault"
version = "0.1.0"
description = "Приватный self-hosted сервис управления Telegram-аккаунтами через aiogram/Raito-бота."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "aiogram>=3.13.1",
    "raito>=1.3.4",
    "kurigram>=2.2.24",
    "tgcrypto>=1.2.5",
    "opentele>=1.15.1",
    "telethon>=1.44.0",
    "sqlalchemy[asyncio]>=2.0.34",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "rich>=13.9.4",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[project.scripts]
sessionvault-bot = "sessionvault.entrypoints.bot:main"
sessionvault-worker = "sessionvault.entrypoints.worker:main"
sessionvault-listener = "sessionvault.entrypoints.listener:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sessionvault"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["research/", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",    # bot UI strings are often longer than 100 chars
    "E702",    # guard-clause one-liners in bot flows
    "N818",    # exceptions without Error suffix are allowed here
    "RUF001",  # Russian bot text and icons are intentional
    "RUF002",
    "RUF003",
    "UP042",   # SQLAlchemy enum interop is clearer with str, Enum
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["research/", "alembic/", "tests/fixtures"]

[[tool.mypy.overrides]]
module = ["pyrogram.*", "opentele.*", "telethon.*", "raito.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
